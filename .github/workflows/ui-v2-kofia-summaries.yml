name: UI 2.0 KOFIA Revision Summaries

on:
  workflow_dispatch:
  workflow_run:
    workflows: [UI 2.0 KOFIA Data]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify source parser and UI
        run: |
          python -m unittest discover -s ui-v2/tests -p 'test_*.py'
          node --test ui-v2/tests/*.test.cjs
      - name: Collect matching association revision excerpts
        run: python ui-v2/scripts/collect_kofia_summaries.py --limit 180 --max-seconds 300
      - name: Save only association summary cache
        shell: bash
        run: |
          git add -- ui-v2/data/kofia_summaries.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'auto: update verified association revision excerpts [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
