name: UI 2.0 KOFIA Data

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Daily Financial Regulatory Tracker]
    types: [completed]
    branches: [main]

# The existing workflow is unchanged. This additive workflow runs afterwards.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-kofia:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect and validate KOFIA data for UI 2.0
        run: python ui-v2/scripts/collect_kofia.py
      - name: Collect verified amendment reasons for UI 2.0
        run: python ui-v2/scripts/collect_law_reasons.py
      - name: Verify collector and UI logic
        run: |
          python -m unittest discover -s ui-v2/tests -p 'test_*.py'
          node --test ui-v2/tests/core.test.cjs ui-v2/tests/kofia.test.cjs ui-v2/tests/reasons.test.cjs
      - name: Commit only UI 2.0 supplemental data
        shell: bash
        run: |
          git add -- ui-v2/data/kofia_data.json ui-v2/data/kofia_data.js ui-v2/data/law_reasons.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'auto: update UI 2.0 KOFIA data [skip ci]'
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
