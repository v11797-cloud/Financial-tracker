name: Daily Financial Regulatory Tracker

on:
  schedule:
    # 매일 한국 시간 오전 8시 (UTC 23시) 자동 실행
    - cron: '0 23 * * *'
  # GitHub 웹상에서 수동으로 실행 가능하도록 설정
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Latest Financial Regulations
        run: |
          python src/main.py

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: 매일 규제 데이터 자동 업데이트 [skip ci]"
          file_pattern: 'data/regulatory_data.json data/regulatory_data.js'
