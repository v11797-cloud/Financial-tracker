<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>금융 규제 실시간 업데이트 대시보드</title>
    <link rel="stylesheet" href="index.css">
    <!-- Lucide Icons CDN (아이콘 사용) -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- 헤더 섹션 -->
        <header class="header">
            <div class="brand-section">
                <h1>금융 규제 실시간 대시보드</h1>
                <p>자본시장법, 금융소비자보호법 등 금융위 고시/공고 및 보도자료 업데이트 내역</p>
            </div>
            <div style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
                <div class="view-switcher" id="view-switcher">
                    <button class="view-btn active" data-view="list">
                        <i data-lucide="list" style="width: 16px; height: 16px;"></i>
                        <span>리스트 뷰</span>
                    </button>
                    <button class="view-btn" data-view="calendar">
                        <i data-lucide="calendar" style="width: 16px; height: 16px;"></i>
                        <span>시행일 캘린더 뷰</span>
                    </button>
                </div>
                <div class="status-badge">
                    <span class="pulse-dot"></span>
                    <span>매일 자동 업데이트 구동 중</span>
                </div>
            </div>
        </header>

        <!-- 통계 요약 카드 섹션 -->
        <section class="stats-grid">
            <div class="stat-card total">
                <div class="stat-label">누적 수집 규제</div>
                <div class="stat-value" id="stat-total">0</div>
            </div>
            <div class="stat-card trend">
                <div class="stat-label">금융시장동향</div>
                <div class="stat-value" id="stat-trend">0</div>
            </div>
            <div class="stat-card press">
                <div class="stat-label">보도자료/참고</div>
                <div class="stat-value" id="stat-press">0</div>
            </div>
            <div class="stat-card preview">
                <div class="stat-label">입법/규정예고</div>
                <div class="stat-value" id="stat-preview">0</div>
            </div>
            <div class="stat-card law">
                <div class="stat-label">공포/시행 법령</div>
                <div class="stat-value" id="stat-law">0</div>
            </div>
        </section>

        <!-- 검색 및 필터 패널 -->
        <section class="filter-panel">
            <div class="search-box">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="search-input" class="search-input" placeholder="검색하고 싶은 법안명, 담당 부서 또는 키워드를 입력하세요...">
            </div>
            
            <div class="filter-row">
                <!-- 카테고리 탭 필터 -->
                <div class="tab-group" id="tab-group">
                    <button class="filter-tab active" data-category="all">전체 내역</button>
                    <button class="filter-tab" data-category="금융시장동향">금융시장동향</button>
                    <button class="filter-tab" data-category="보도자료">보도자료</button>
                    <button class="filter-tab" data-category="입법예고">입법예고</button>
                    <button class="filter-tab" data-category="공포법령">공포/시행 법령</button>
                </div>

                <!-- 주요 핵심 키워드 칩 필터 -->
                <div class="keyword-group">
                    <span class="keyword-label">중요 규제 필터:</span>
                    <button class="keyword-chip" data-keyword="자본시장">자본시장법</button>
                    <button class="keyword-chip" data-keyword="금융소비자">금융소비자 보호법</button>
                    <button class="keyword-chip" data-keyword="금융투자업규정">금융투자업규정</button>
                    <button class="keyword-chip" data-keyword="지배구조">지배구조법</button>
                </div>
            </div>
        </section>

        <!-- 규제 목록 리스트 영역 -->
        <main class="list-section" id="list-section">
            <!-- 동적으로 생성되는 규제 카드들 -->
        </main>

        <!-- 시행일 캘린더 뷰 영역 -->
        <section class="calendar-container" id="calendar-container" style="display: none;">
            <div class="calendar-header">
                <div class="calendar-title-group">
                    <button class="calendar-nav-btn" id="cal-prev-btn"><i data-lucide="chevron-left" style="width: 18px; height: 18px;"></i></button>
                    <h2 class="calendar-month-title" id="cal-month-title">2026년 9월</h2>
                    <button class="calendar-nav-btn" id="cal-next-btn"><i data-lucide="chevron-right" style="width: 18px; height: 18px;"></i></button>
                    <button class="calendar-today-btn" id="cal-today-btn">오늘로 이동</button>
                </div>
                <div style="font-size: 0.85rem; color: var(--text-secondary); display: flex; align-items: center; gap: 0.5rem;">
                    <span style="color: #F472B6; font-weight: 700;">●</span> <span>시행일 기준 캘린더 (클릭 시 상세/개정이유 페이지 이동)</span>
                </div>
            </div>
            <div class="calendar-grid" id="calendar-grid">
                <!-- 동적 캘린더 생성 -->
            </div>
        </section>
    </div>

    <!-- 복사 성공 토스트 알림창 -->
    <div id="toast-message" style="
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        background: #10B981;
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        font-weight: 600;
        font-size: 0.9rem;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease, transform 0.3s ease;
        transform: translateY(10px);
        z-index: 9999;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    ">
        <i data-lucide="check-circle" style="width: 18px; height: 18px;"></i>
        <span>링크 복사가 완료되었습니다.</span>
    </div>

    <!-- 데이터 파일 탑재 -->
    <script src="data/regulatory_data.js"></script>

    <!-- 인터랙티브 비즈니스 로직 스크립트 -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Lucide 아이콘 초기화
            lucide.createIcons();

            // 데이터 탑재 확인
            const rawData = window.regulatoryData || [];
            
            // 전역 필터 상태
            let currentSearch = "";
            let currentCategory = "all";
            let activeKeywords = new Set();

            // 엘리먼트 참조
            const searchInput = document.getElementById("search-input");
            const tabGroup = document.getElementById("tab-group");
            const listSection = document.getElementById("list-section");
            const toastMessage = document.getElementById("toast-message");

            // 통계 요소 참조
            const statTotal = document.getElementById("stat-total");
            const statTrend = document.getElementById("stat-trend");
            const statPress = document.getElementById("stat-press");
            const statPreview = document.getElementById("stat-preview");
            const statLaw = document.getElementById("stat-law");

            // 통계 세팅
            function updateStatistics(data) {
                statTotal.textContent = data.length;
                statTrend.textContent = data.filter(d => d.category === "금융시장동향").length;
                statPress.textContent = data.filter(d => d.category === "보도자료").length;
                statPreview.textContent = data.filter(d => d.category === "입법예고").length;
                if (statLaw) statLaw.textContent = data.filter(d => d.category === "공포법령").length;
            }

            // 하이라이팅하고 싶은 금융 핵심 키워드 리스트
            const targetKeywords = [
                "자본시장법", "자본시장", "금융소비자보호법", "금융소비자", "금소법",
                "금융투자업규정", "금융투자", "개정", "규정개정", "입법예고", "고시",
                "가상자산", "내부통제", "책무구조도", "공매도"
            ];

            // 타이틀 내 키워드 하이라이팅 헬퍼
            function highlightTitle(title) {
                let highlighted = title;
                targetKeywords.forEach(kw => {
                    const regex = new RegExp(`(${kw})`, "gi");
                    highlighted = highlighted.replace(regex, `<span class="highlight-text">$1</span>`);
                });
                return highlighted;
            }

            // 토스트 알림 띄우기
            function showToast(text) {
                toastMessage.querySelector("span").textContent = text;
                toastMessage.style.opacity = "1";
                toastMessage.style.transform = "translateY(0)";
                
                setTimeout(() => {
                    toastMessage.style.opacity = "0";
                    toastMessage.style.transform = "translateY(10px)";
                }, 2000);
            }

            // 클립보드 복사 함수
            window.copyToClipboard = function(url) {
                navigator.clipboard.writeText(url).then(() => {
                    showToast("링크가 클립보드에 복사되었습니다.");
                }).catch(err => {
                    // 대체 복사 메커니즘
                    const el = document.createElement('textarea');
                    el.value = url;
                    document.body.appendChild(el);
                    el.select();
                    document.execCommand('copy');
                    document.body.removeChild(el);
                    showToast("링크가 복사되었습니다.");
                });
            }

            // 동적 칩별 정밀 법령/하위법령 매칭 룰
            const keywordFilterRules = {
                "자본시장": (title) => {
                    // 자본시장과 금융투자업에 관한 법률 및 시행령/시행규칙만 매칭 (집무규칙 등 기타 행정규칙 제외)
                    return title.includes("자본시장과 금융투자업에 관한 법률") || title.includes("자본시장법");
                },
                "금융소비자": (title) => {
                    // 금융소비자 보호에 관한 법률 및 시행령/시행규칙만 매칭 (감독규정 등 제외)
                    return title.includes("금융소비자 보호에 관한 법률") || title.includes("금소법");
                },
                "금융투자업규정": (title) => {
                    // 금융투자업규정 및 시행세칙만 매칭
                    return title.includes("금융투자업규정");
                },
                "지배구조": (title) => {
                    // 금융회사의 지배구조에 관한 법률 및 시행령/시행규칙만 매칭
                    return title.includes("금융회사의 지배구조에 관한 법률") || title.includes("지배구조법");
                }
            };

            // 전역 뷰 및 캘린더 상태
            let currentView = "list";
            let calYear = new Date().getFullYear();
            let calMonth = new Date().getMonth(); // 0 ~ 11

            // 뷰 스위처 참조
            const viewSwitcher = document.getElementById("view-switcher");
            const filterPanel = document.querySelector(".filter-panel");
            const calendarContainer = document.getElementById("calendar-container");
            const calendarGrid = document.getElementById("calendar-grid");
            const calMonthTitle = document.getElementById("cal-month-title");
            const calPrevBtn = document.getElementById("cal-prev-btn");
            const calNextBtn = document.getElementById("cal-next-btn");
            const calTodayBtn = document.getElementById("cal-today-btn");

            // 뷰 스위처 이벤트 바인딩
            viewSwitcher.addEventListener("click", (e) => {
                const btn = e.target.closest(".view-btn");
                if (!btn) return;

                document.querySelectorAll(".view-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");

                currentView = btn.dataset.view;
                if (currentView === "list") {
                    filterPanel.style.display = "flex";
                    listSection.style.display = "flex";
                    calendarContainer.style.display = "none";
                    renderList();
                } else {
                    filterPanel.style.display = "none";
                    listSection.style.display = "none";
                    calendarContainer.style.display = "flex";
                    renderCalendar();
                }
            });

            // 캘린더 네비게이션 이벤트
            calPrevBtn.addEventListener("click", () => {
                calMonth--;
                if (calMonth < 0) {
                    calMonth = 11;
                    calYear--;
                }
                renderCalendar();
            });

            calNextBtn.addEventListener("click", () => {
                calMonth++;
                if (calMonth > 11) {
                    calMonth = 0;
                    calYear++;
                }
                renderCalendar();
            });

            calTodayBtn.addEventListener("click", () => {
                const today = new Date();
                calYear = today.getFullYear();
                calMonth = today.getMonth();
                renderCalendar();
            });

            // D-Day 계산 헬퍼
            function calculateDDay(dateStr) {
                if (!dateStr) return null;
                const target = new Date(dateStr);
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                target.setHours(0, 0, 0, 0);

                const diffTime = target - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays === 0) return "D-Day";
                if (diffDays > 0) return `D-${diffDays}`;
                return `시행중`;
            }

            // 시행일 캘린더 렌더링 (오직 '공포/시행 법령' 항목만 깔끔하게 표시)
            function renderCalendar() {
                calMonthTitle.textContent = `${calYear}년 ${calMonth + 1}월`;

                // 시행일자별 데이터 맵 구축 (오직 category === '공포법령' 만 필터링)
                const dateMap = {};
                rawData.forEach(item => {
                    if (item.category === "공포법령") {
                        const enfDate = item.enf_date || item.date;
                        if (enfDate) {
                            if (!dateMap[enfDate]) dateMap[enfDate] = [];
                            dateMap[enfDate].push(item);
                        }
                    }
                });

                // 달력 그리드 HTML 생성
                const dayNames = ["일", "월", "화", "수", "목", "금", "토"];
                let gridHtml = dayNames.map((day, idx) => {
                    const cls = idx === 0 ? "sun" : (idx === 6 ? "sat" : "");
                    return `<div class="calendar-day-header ${cls}">${day}</div>`;
                }).join("");

                const firstDay = new Date(calYear, calMonth, 1).getDay();
                const lastDate = new Date(calYear, calMonth + 1, 0).getDate();
                const prevLastDate = new Date(calYear, calMonth, 0).getDate();

                const todayObj = new Date();
                const todayYear = todayObj.getFullYear();
                const todayMonth = todayObj.getMonth();
                const todayDate = todayObj.getDate();

                // 이전 달 날짜 채우기
                for (let i = firstDay - 1; i >= 0; i--) {
                    const num = prevLastDate - i;
                    gridHtml += `
                        <div class="calendar-cell other-month">
                            <div class="calendar-date-header">
                                <span class="calendar-date-num">${num}</span>
                            </div>
                        </div>
                    `;
                }

                // 현재 달 날짜 채우기
                for (let date = 1; date <= lastDate; date++) {
                    const isToday = calYear === todayYear && calMonth === todayMonth && date === todayDate;
                    const todayCls = isToday ? "today-cell" : "";

                    const monthStr = String(calMonth + 1).padStart(2, "0");
                    const dateStr = String(date).padStart(2, "0");
                    const keyDate = `${calYear}-${monthStr}-${dateStr}`;

                    const items = dateMap[keyDate] || [];

                    const chipsHtml = items.map(item => {
                        const dDay = calculateDDay(keyDate);
                        const isDDay = dDay && dDay.startsWith("D-");
                        const chipCls = isDDay ? "d-day-chip" : "";
                        const lawTitle = item.law_name || item.title;

                        return `
                            <div class="calendar-item-chip ${chipCls}" onclick="window.open('${item.url}', '_blank')" title="${item.title}">
                                ${dDay ? `<span class="d-day-badge">${dDay}</span>` : ''}
                                <span>${lawTitle}</span>
                            </div>
                        `;
                    }).join("");

                    gridHtml += `
                        <div class="calendar-cell ${todayCls}">
                            <div class="calendar-date-header">
                                <span class="calendar-date-num">${date}</span>
                            </div>
                            ${chipsHtml}
                        </div>
                    `;
                }

                // 다음 달 날짜 채우기 (총 셀 수 35개 또는 42개 맞춤)
                const totalCellsSoFar = firstDay + lastDate;
                const totalCells = totalCellsSoFar > 35 ? 42 : 35;
                const nextDays = totalCells - totalCellsSoFar;

                for (let date = 1; date <= nextDays; date++) {
                    gridHtml += `
                        <div class="calendar-cell other-month">
                            <div class="calendar-date-header">
                                <span class="calendar-date-num">${date}</span>
                            </div>
                        </div>
                    `;
                }

                calendarGrid.innerHTML = gridHtml;
                lucide.createIcons();
            }

            // 카드 리스트 렌더링
            function renderList() {
                // 필터링 적용
                let filtered = rawData.filter(item => {
                    // 1. 카테고리 필터
                    if (currentCategory !== "all" && item.category !== currentCategory) {
                        return false;
                    }

                    // 2. 키워드 칩 필터 (정밀 룰 적용)
                    if (activeKeywords.size > 0) {
                        const matchesKeyword = Array.from(activeKeywords).every(kw => {
                            if (keywordFilterRules[kw]) {
                                return keywordFilterRules[kw](item.title);
                            }
                            return item.title.toLowerCase().includes(kw.toLowerCase());
                        });
                        if (!matchesKeyword) return false;
                    }

                    // 3. 텍스트 검색 필터
                    if (currentSearch.trim() !== "") {
                        const searchLower = currentSearch.toLowerCase();
                        const titleMatch = item.title.toLowerCase().includes(searchLower);
                        const deptMatch = item.dept.toLowerCase().includes(searchLower);
                        const categoryMatch = item.category.toLowerCase().includes(searchLower);
                        return titleMatch || deptMatch || categoryMatch;
                    }

                    return true;
                });

                // 리스트가 비었을 때
                if (filtered.length === 0) {
                    listSection.innerHTML = `
                        <div class="empty-state">
                            <i data-lucide="info" style="width: 48px; height: 48px; margin-bottom: 1rem; opacity: 0.6;"></i>
                            <h3>조건에 일치하는 규제 내역이 없습니다.</h3>
                            <p>검색어나 필터 칩을 확인해 주세요.</p>
                        </div>
                    `;
                    lucide.createIcons();
                    return;
                }

                // 카드 생성
                listSection.innerHTML = filtered.map(item => {
                    let badgeClass = "trend";
                    if (item.category === "보도자료") badgeClass = "press";
                    else if (item.category === "입법예고") badgeClass = "preview";
                    else if (item.category === "공포법령") badgeClass = "law";

                    const badgeLabel = item.category === "공포법령" ? "공포/시행 법령" : item.category;
                    const btnLabel = item.category === "공포법령" ? "개정이유 보기" : "바로가기";

                    return `
                        <article class="regulatory-card">
                            <div class="card-main-info">
                                <div class="card-meta-row">
                                    <span class="category-badge ${badgeClass}">${badgeLabel}</span>
                                    <span class="dept-tag">${item.dept}</span>
                                    <span class="date-text">공포일: ${item.date}</span>
                                    ${item.enf_date ? `<span class="date-text" style="color: #EC4899; font-weight:600;">(시행일: ${item.enf_date})</span>` : ''}
                                </div>
                                <h3 class="card-title">${highlightTitle(item.title)}</h3>
                            </div>
                            <div class="card-actions">
                                <button class="action-btn" onclick="copyToClipboard('${item.url}')">
                                    <i data-lucide="copy" style="width: 14px; height: 14px;"></i>
                                    <span>복사</span>
                                </button>
                                <a href="${item.url}" target="_blank" class="action-btn primary">
                                    <span>${btnLabel}</span>
                                    <i data-lucide="external-link" style="width: 14px; height: 14px;"></i>
                                </a>
                            </div>
                        </article>
                    `;
                }).join("");

                // 동적 생성 후 아이콘 렌더링
                lucide.createIcons();
            }

            // 이벤트 바인딩: 검색 입력
            searchInput.addEventListener("input", (e) => {
                currentSearch = e.target.value;
                renderList();
            });

            // 이벤트 바인딩: 카테고리 탭 클릭
            tabGroup.addEventListener("click", (e) => {
                const targetTab = e.target.closest(".filter-tab");
                if (!targetTab) return;

                // 액티브 클래스 이동
                document.querySelectorAll(".filter-tab").forEach(tab => tab.classList.remove("active"));
                targetTab.classList.add("active");

                currentCategory = targetTab.dataset.category;
                renderList();
            });

            // 이벤트 바인딩: 키워드 칩 클릭
            document.querySelectorAll(".keyword-chip").forEach(chip => {
                chip.addEventListener("click", (e) => {
                    const keyword = chip.dataset.keyword;
                    if (activeKeywords.has(keyword)) {
                        activeKeywords.delete(keyword);
                        chip.classList.remove("active");
                    } else {
                        activeKeywords.add(keyword);
                        chip.classList.add("active");
                    }
                    renderList();
                });
            });

            // 데이터 초기 세팅 및 렌더링
            updateStatistics(rawData);
            renderList();
        });
    </script>
</body>
</html>
