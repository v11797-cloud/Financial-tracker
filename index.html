<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>금융 규제 실시간 업데이트 대시보드</title>
    <link rel="stylesheet" href="index.css">
    <!-- Lucide Icons CDN (아이콘 사용) -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- 헤더 섹션 -->
        <header class="header">
            <div class="brand-section">
                <h1>금융 규제 실시간 대시보드</h1>
                <p>자본시장법, 금융소비자보호법 등 금융위 고시/공고 및 보도자료 업데이트 내역</p>
            </div>
            <div class="status-badge">
                <span class="pulse-dot"></span>
                <span>매일 자동 업데이트 구동 중</span>
            </div>
        </header>

        <!-- 통계 요약 카드 섹션 -->
        <section class="stats-grid">
            <div class="stat-card total">
                <div class="stat-label">누적 수집 규제</div>
                <div class="stat-value" id="stat-total">0</div>
            </div>
            <div class="stat-card trend">
                <div class="stat-label">금융시장동향</div>
                <div class="stat-value" id="stat-trend">0</div>
            </div>
            <div class="stat-card press">
                <div class="stat-label">보도자료/참고</div>
                <div class="stat-value" id="stat-press">0</div>
            </div>
            <div class="stat-card preview">
                <div class="stat-label">입법/규정예고</div>
                <div class="stat-value" id="stat-preview">0</div>
            </div>
        </section>

        <!-- 검색 및 필터 패널 -->
        <section class="filter-panel">
            <div class="search-box">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="search-input" class="search-input" placeholder="검색하고 싶은 법안명, 담당 부서 또는 키워드를 입력하세요...">
            </div>
            
            <div class="filter-row">
                <!-- 카테고리 탭 필터 -->
                <div class="tab-group" id="tab-group">
                    <button class="filter-tab active" data-category="all">전체 내역</button>
                    <button class="filter-tab" data-category="금융시장동향">금융시장동향</button>
                    <button class="filter-tab" data-category="보도자료">보도자료</button>
                    <button class="filter-tab" data-category="입법예고">입법예고</button>
                </div>

                <!-- 주요 핵심 키워드 칩 필터 -->
                <div class="keyword-group">
                    <span class="keyword-label">중요 규제 필터:</span>
                    <button class="keyword-chip" data-keyword="자본시장">자본시장법</button>
                    <button class="keyword-chip" data-keyword="소비자보호">금소법</button>
                    <button class="keyword-chip" data-keyword="금융투자">금융투자업</button>
                    <button class="keyword-chip" data-keyword="개정">개정안</button>
                    <button class="keyword-chip" data-keyword="가상자산">가상자산</button>
                </div>
            </div>
        </section>

        <!-- 규제 목록 리스트 영역 -->
        <main class="list-section" id="list-section">
            <!-- 동적으로 생성되는 규제 카드들 -->
        </main>
    </div>

    <!-- 복사 성공 토스트 알림창 -->
    <div id="toast-message" style="
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        background: #10B981;
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        font-weight: 600;
        font-size: 0.9rem;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease, transform 0.3s ease;
        transform: translateY(10px);
        z-index: 9999;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    ">
        <i data-lucide="check-circle" style="width: 18px; height: 18px;"></i>
        <span>링크 복사가 완료되었습니다.</span>
    </div>

    <!-- 데이터 파일 탑재 -->
    <script src="data/regulatory_data.js"></script>

    <!-- 인터랙티브 비즈니스 로직 스크립트 -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Lucide 아이콘 초기화
            lucide.createIcons();

            // 데이터 탑재 확인
            const rawData = window.regulatoryData || [];
            
            // 전역 필터 상태
            let currentSearch = "";
            let currentCategory = "all";
            let activeKeywords = new Set();

            // 엘리먼트 참조
            const searchInput = document.getElementById("search-input");
            const tabGroup = document.getElementById("tab-group");
            const listSection = document.getElementById("list-section");
            const toastMessage = document.getElementById("toast-message");

            // 통계 요소 참조
            const statTotal = document.getElementById("stat-total");
            const statTrend = document.getElementById("stat-trend");
            const statPress = document.getElementById("stat-press");
            const statPreview = document.getElementById("stat-preview");

            // 통계 세팅
            function updateStatistics(data) {
                statTotal.textContent = data.length;
                statTrend.textContent = data.filter(d => d.category === "금융시장동향").length;
                statPress.textContent = data.filter(d => d.category === "보도자료").length;
                statPreview.textContent = data.filter(d => d.category === "입법예고").length;
            }

            // 하이라이팅하고 싶은 금융 핵심 키워드 리스트
            const targetKeywords = [
                "자본시장법", "자본시장", "금융소비자보호법", "금융소비자", "금소법",
                "금융투자업규정", "금융투자", "개정", "규정개정", "입법예고", "고시",
                "가상자산", "내부통제", "책무구조도", "공매도"
            ];

            // 타이틀 내 키워드 하이라이팅 헬퍼
            function highlightTitle(title) {
                let highlighted = title;
                targetKeywords.forEach(kw => {
                    const regex = new RegExp(`(${kw})`, "gi");
                    highlighted = highlighted.replace(regex, `<span class="highlight-text">$1</span>`);
                });
                return highlighted;
            }

            // 토스트 알림 띄우기
            function showToast(text) {
                toastMessage.querySelector("span").textContent = text;
                toastMessage.style.opacity = "1";
                toastMessage.style.transform = "translateY(0)";
                
                setTimeout(() => {
                    toastMessage.style.opacity = "0";
                    toastMessage.style.transform = "translateY(10px)";
                }, 2000);
            }

            // 클립보드 복사 함수
            window.copyToClipboard = function(url) {
                navigator.clipboard.writeText(url).then(() => {
                    showToast("링크가 클립보드에 복사되었습니다.");
                }).catch(err => {
                    // 대체 복사 메커니즘
                    const el = document.createElement('textarea');
                    el.value = url;
                    document.body.appendChild(el);
                    el.select();
                    document.execCommand('copy');
                    document.body.removeChild(el);
                    showToast("링크가 복사되었습니다.");
                });
            }

            // 카드 리스트 렌더링
            function renderList() {
                // 필터링 적용
                let filtered = rawData.filter(item => {
                    // 1. 카테고리 필터
                    if (currentCategory !== "all" && item.category !== currentCategory) {
                        return false;
                    }

                    // 2. 키워드 칩 필터
                    if (activeKeywords.size > 0) {
                        const matchesKeyword = Array.from(activeKeywords).every(kw => 
                            item.title.toLowerCase().includes(kw.toLowerCase())
                        );
                        if (!matchesKeyword) return false;
                    }

                    // 3. 텍스트 검색 필터
                    if (currentSearch.trim() !== "") {
                        const searchLower = currentSearch.toLowerCase();
                        const titleMatch = item.title.toLowerCase().includes(searchLower);
                        const deptMatch = item.dept.toLowerCase().includes(searchLower);
                        const categoryMatch = item.category.toLowerCase().includes(searchLower);
                        return titleMatch || deptMatch || categoryMatch;
                    }

                    return true;
                });

                // 리스트가 비었을 때
                if (filtered.length === 0) {
                    listSection.innerHTML = `
                        <div class="empty-state">
                            <i data-lucide="info" style="width: 48px; height: 48px; margin-bottom: 1rem; opacity: 0.6;"></i>
                            <h3>조건에 일치하는 규제 내역이 없습니다.</h3>
                            <p>검색어나 필터 칩을 확인해 주세요.</p>
                        </div>
                    `;
                    lucide.createIcons();
                    return;
                }

                // 카드 생성
                listSection.innerHTML = filtered.map(item => {
                    const badgeClass = item.category === "금융시장동향" ? "trend" : (item.category === "보도자료" ? "press" : "preview");
                    return `
                        <article class="regulatory-card">
                            <div class="card-main-info">
                                <div class="card-meta-row">
                                    <span class="category-badge ${badgeClass}">${item.category}</span>
                                    <span class="dept-tag">${item.dept}</span>
                                    <span class="date-text">${item.date}</span>
                                </div>
                                <h3 class="card-title">${highlightTitle(item.title)}</h3>
                            </div>
                            <div class="card-actions">
                                <button class="action-btn" onclick="copyToClipboard('${item.url}')">
                                    <i data-lucide="copy" style="width: 14px; height: 14px;"></i>
                                    <span>복사</span>
                                </button>
                                <a href="${item.url}" target="_blank" class="action-btn primary">
                                    <span>바로가기</span>
                                    <i data-lucide="external-link" style="width: 14px; height: 14px;"></i>
                                </a>
                            </div>
                        </article>
                    `;
                }).join("");

                // 동적 생성 후 아이콘 렌더링
                lucide.createIcons();
            }

            // 이벤트 바인딩: 검색 입력
            searchInput.addEventListener("input", (e) => {
                currentSearch = e.target.value;
                renderList();
            });

            // 이벤트 바인딩: 카테고리 탭 클릭
            tabGroup.addEventListener("click", (e) => {
                const targetTab = e.target.closest(".filter-tab");
                if (!targetTab) return;

                // 액티브 클래스 이동
                document.querySelectorAll(".filter-tab").forEach(tab => tab.classList.remove("active"));
                targetTab.classList.add("active");

                currentCategory = targetTab.dataset.category;
                renderList();
            });

            // 이벤트 바인딩: 키워드 칩 클릭
            document.querySelectorAll(".keyword-chip").forEach(chip => {
                chip.addEventListener("click", (e) => {
                    const keyword = chip.dataset.keyword;
                    if (activeKeywords.has(keyword)) {
                        activeKeywords.delete(keyword);
                        chip.classList.remove("active");
                    } else {
                        activeKeywords.add(keyword);
                        chip.classList.add("active");
                    }
                    renderList();
                });
            });

            // 데이터 초기 세팅 및 렌더링
            updateStatistics(rawData);
            renderList();
        });
    </script>
</body>
</html>
